name: 'Agentic PR Review Tribunal'
description: 'Sovereign GitHub Action for agentic code governance, synthetic review tribunals, and automated PR verification'
author: 'Saul Fernandez & Tachikoma Core'

inputs:
  github-token:
    description: 'GitHub Token for posting review comments and reading PR data'
    required: true
    default: ${{ github.token }}
  provider:
    description: 'Default AI model provider: anthropic, openai, deepseek, or google'
    required: false
    default: 'anthropic'
  api-key:
    description: 'Default API key for the chosen AI model provider'
    required: false
  model:
    description: 'Default model identifier to use for the tribunal seats'
    required: false
    default: 'claude-sonnet-4-6'

  # Seat A (Logic & Correctness) specialized configuration
  seat-a-provider:
    description: 'Provider for Seat A (Logic & Contracts): google, openai, deepseek, or anthropic'
    required: false
  seat-a-model:
    description: 'Model for Seat A (e.g. gemini-2.5-flash, o1, claude-opus-4-6)'
    required: false
  seat-a-api-key:
    description: 'API key for Seat A'
    required: false

  # Seat B (Test Quality & Boundaries) specialized configuration
  seat-b-provider:
    description: 'Provider for Seat B (Test Boundaries): deepseek, openai, anthropic, or google'
    required: false
  seat-b-model:
    description: 'Model for Seat B (e.g. deepseek-reasoner, o3-mini, claude-sonnet-4-6)'
    required: false
  seat-b-api-key:
    description: 'API key for Seat B'
    required: false

  # Seat C (Cognitive Load & Radical Simplification) specialized configuration
  seat-c-provider:
    description: 'Provider for Seat C (KISS): anthropic, openai, deepseek, or google'
    required: false
  seat-c-model:
    description: 'Model for Seat C (e.g. claude-haiku-4-5, gpt-4o-mini)'
    required: false
  seat-c-api-key:
    description: 'API key for Seat C'
    required: false
  max-corrections:
    description: 'Maximum number of automated correction loops before human intervention is required'
    required: false
    default: '3'
  auto-merge:
    description: 'Automatically merge the PR if tribunal unanimously/majority approves and invariants are green'
    required: false
    default: 'false'
  artifact-dir:
    description: 'Local directory where review.md and verdict.json are persisted'
    required: false
    default: '.tribunal'
  merge-method:
    description: 'Merge method to use for auto-merge: squash, merge, or rebase'
    required: false
    default: 'squash'
  check-overlap:
    description: 'Whether to verify that main has not drifted on touched files since branch creation'
    required: false
    default: 'true'
  strict-invariants:
    description: 'Enforce that linting, build, and tests must be green before tribunal approves'
    required: false
    default: 'true'

outputs:
  verdict:
    description: 'Final tribunal verdict: APPROVED, CHANGES_REQUESTED, or BLOCKED'
  blockers-count:
    description: 'Total number of blocking findings detected'
  overlap-detected:
    description: 'Whether a merge collision overlap was detected with origin/main'
  budget-exhausted:
    description: 'Whether the automated correction iteration budget was exhausted'
  merged:
    description: 'Whether the pull request was automatically merged by the gate'
  ready-to-merge:
    description: 'Whether the pull request passed all invariants and tribunal review with 0 blockers'

runs:
  using: 'node20'
  main: 'dist/index.js'
